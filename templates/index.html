<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Screening System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Resume Screening System</h1>
            <p>Analyze a resume against a job description</p>
        </div>


        <div class="card">

            <form action="/analyze"
                  method="POST"
                  enctype="multipart/form-data">

                <div class="form-group">

                    <label for="resume">
                        Upload Resume
                    </label>

                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf"
                        required
                    >

                    <small>
                        Upload a PDF resume
                    </small>

                </div>


                <div class="form-group">

                    <label for="job_description">
                        Job Description
                    </label>

                    <textarea
                        id="job_description"
                        name="job_description"
                        rows="12"
                        placeholder="Paste the job description here..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>

</html>
